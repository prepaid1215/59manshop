name: Sitewide mobile paragraph rendering QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect every HTML page at 390 and 480 px
        run: |
          python scripts/serve_preview.py >/tmp/preview.log 2>&1 &
          sleep 2
          node scripts/assert_sitewide_paragraph_reading.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitewide-reading-review-390px
          path: reports/ui/sitewide-paragraph-reading/
          if-no-files-found: warn
