name: AI answer integrity QA

on:
  pull_request:
    paths:
      - '**/index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/check_ai_answer_integrity.py'
      - '.github/workflows/ai-answer-integrity.yml'
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/check_ai_answer_integrity.py'
      - '.github/workflows/ai-answer-integrity.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check visible answers against AI-readable metadata
        run: python3 scripts/check_ai_answer_integrity.py
