          file img/article-photos/{identity-resident-card,identity-driver-license,identity-mobile-id,esim-guide}.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/article-photos/identity-resident-card.png img/article-photos/identity-driver-license.png img/article-photos/identity-mobile-id.png img/article-photos/esim-guide.png
          if ! git diff --cached --quiet; then git commit -m 'Add supplied ID and eSIM reference images'; git push origin HEAD:feat/identity-esim-posters-20261026; fi
