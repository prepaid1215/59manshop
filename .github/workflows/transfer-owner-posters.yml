name: Transfer four owner-provided reference images
on:
  push:
    branches:
      - feat/identity-esim-posters-20261026
    paths:
      - .github/workflows/transfer-owner-posters.yml
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reference images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p img/article-photos
          valid_png() { [ "$(head -c 8 "$1" | od -An -tx1 | tr -d ' \n')" = '89504e470d0a1a0a' ]; }
          download() {
            local file="$1" high="$2" fallback="$3"
            if curl --fail --silent --show-error --location --retry 2 "$high" -o "$file" && valid_png "$file"; then echo "requested full-size: $file"; return 0; fi
            curl --fail --silent --show-error --location --retry 2 "$fallback" -o "$file"
            valid_png "$file" || { echo "Invalid PNG: $file"; exit 1; }
            echo "thumbnail fallback: $file"
          }
          download 'img/article-photos/identity-resident-card.png' 'https://media.canva.com/v2/image-resize/format:PNG/height:361/quality:100/uri:ifs%3A%2F%2FM%2F856deb15-9066-446d-8807-c7d522319b66/watermark:F/width:265?csig=AAAAAAAAAAAAAAAAAAAAABkpRDc2R7Kl92VBL7voPDv0UBXM1G9CM21GKzUPQCwr&exp=1793016461&osig=AAAAAAAAAAAAAAAAAAAAAEYRhHSR9NZvfbHZDKg-Z-NqnrclyczdgIg_XUOvoIVq&signer=media-rpc&token=AAIAAU0AJDg1NmRlYjE1LTkwNjYtNDQ2ZC04ODA3LWM3ZDUyMjMxOWI2NgAAAAABoXgb9sjYb67k22FmlIgWdH-YDpDIsEPeT_RYTUHnQl16tJyPfQ&x-canva-quality=thumbnail' 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F856deb15-9066-446d-8807-c7d522319b66/watermark:F/width:146?csig=AAAAAAAAAAAAAAAAAAAAABkpRDc2R7Kl92VBL7voPDv0UBXM1G9CM21GKzUPQCwr&exp=1793016461&osig=AAAAAAAAAAAAAAAAAAAAAEYRhHSR9NZvfbHZDKg-Z-NqnrclyczdgIg_XUOvoIVq&signer=media-rpc&token=AAIAAU0AJDg1NmRlYjE1LTkwNjYtNDQ2ZC04ODA3LWM3ZDUyMjMxOWI2NgAAAAABoXgb9sjYb67k22FmlIgWdH-YDpDIsEPeT_RYTUHnQl16tJyPfQ&x-canva-quality=thumbnail'
          download 'img/article-photos/identity-driver-license.png' 'https://media.canva.com/v2/image-resize/format:PNG/height:361/quality:100/uri:ifs%3A%2F%2FM%2F1b28281e-288b-49df-bae4-65d3bf9c82c9/watermark:F/width:261?csig=AAAAAAAAAAAAAAAAAAAAACKZydXxx5c4WEOU-YV6yoBj1nu3Ka4E8w-oQ3npeh1p&exp=1793013626&osig=AAAAAAAAAAAAAAAAAAAAAHvYFxgWlzQ4w12PgyvByltBpqOCjOsubpENMk_ehRzj&signer=media-rpc&token=AAIAAU0AJDFiMjgyODFlLTI4OGItNDlkZi1iYWU0LTY1ZDNiZjljODJjOQAAAAABoXfwtJBDvn5qv0Z81xZCAiQYr3SEl8wY2y0wUyOrRfKAnTs5XQ&x-canva-quality=thumbnail' 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F1b28281e-288b-49df-bae4-65d3bf9c82c9/watermark:F/width:144?csig=AAAAAAAAAAAAAAAAAAAAACKZydXxx5c4WEOU-YV6yoBj1nu3Ka4E8w-oQ3npeh1p&exp=1793013626&osig=AAAAAAAAAAAAAAAAAAAAAHvYFxgWlzQ4w12PgyvByltBpqOCjOsubpENMk_ehRzj&signer=media-rpc&token=AAIAAU0AJDFiMjgyODFlLTI4OGItNDlkZi1iYWU0LTY1ZDNiZjljODJjOQAAAAABoXfwtJBDvn5qv0Z81xZCAiQYr3SEl8wY2y0wUyOrRfKAnTs5XQ&x-canva-quality=thumbnail'
