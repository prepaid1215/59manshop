name: Blue magazine UI QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run magazine pages UI and behavior QA
        run: |
          python scripts/serve_preview.py >/tmp/preview.log 2>&1 &
          sleep 2
          node scripts/assert_blue_magazine.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-magazine-screenshots
          path: reports/ui/blue-magazine-qa/
          if-no-files-found: warn
