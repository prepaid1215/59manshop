name: One-time public preplan tracking audit
on:
  push:
    branches: [audit/public-preplan-tags-20261028]
    paths:
      - '.github/workflows/audit-public-preplan-tags.yml'
permissions:
  contents: read
jobs:
  public-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze public home HTML only (no login)
        run: |
          python3 - <<'PY'
          import urllib.request,re,json
          sites=['https://preplan.site/','https://www.59man.shop/','https://preplan.site/lg-self/','https://preplan.site/blog/']
          for url in sites:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; LandingAudit/1.0)'})
                  with urllib.request.urlopen(req,timeout=18) as f:
                      html=f.read(1500000).decode('utf-8','replace')
                      final=f.url
                      status=f.status
                  # Public tag IDs only; never print complete HTML or application/customer data.
                  ids=sorted(set(re.findall(r'GTM-[A-Z0-9]{4,}|G-[A-Z0-9]{7,}|AW-[0-9]{6,}|G-[A-Z0-9]{7,}',html)))
                  print(json.dumps({'url':url,'status':status,'final_url':final,'html_bytes':len(html),'public_tag_ids':ids,'has_dataLayer':bool(re.search(r'dataLayer',html)),'has_consent_mode':bool(re.search('consent.*default|gtag\\(.[,]consent',html,re.I)),'has_analytics_keyword':bool(re.search('google-analytics|gtag/js|googletagmanager.com/gtm.js',html,re.I))},ensure_ascii=False))
              except Exception as e:
                  print(json.dumps({'url':url,'error':str(e)[:180]},ensure_ascii=False))
          try:
              url='https://www.googletagmanager.com/gtm.js?id=GTM-NB2K5MFQ'
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=18) as f:
                  source=f.read(1500000).decode('utf-8','replace')
              ids=sorted(set(re.findall(r'G-[A-Z0-9]{7,}|AW-[0-9]{6,}',source)))
              print(json.dumps({'public_gtm_js':'GTM-NB2K5MFQ','bytes':len(source),'google_ids':ids,'pageview_tag_references':source.count('page_view')},ensure_ascii=False))
          except Exception as e: print(json.dumps({'gtm_error':str(e)[:160]}))
          # Verify public plugin install and enqueue without mutating WordPress.
          for url in ['https://preplan.site/?from=59man_qa_bridge_20261028',
                      'https://preplan.site/wp-content/plugins/mm59-preplan-attribution/assets/bridge.js']:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20) as f:
                      raw=f.read(1500000).decode('utf-8','replace')
                      status=f.status
                  print(json.dumps({'bridge_probe_url':url.split('?')[0],'status':status,
                    'bytes':len(raw),
                    'has_plugin_script_reference':'mm59-preplan-attribution' in raw,
                    'has_preplan_visit_event':'mm59_preplan_visit' in raw,
                    'has_handoff_event':'mm59_application_handoff' in raw,
                    'plugin_script_enqueued':'/wp-content/plugins/mm59-preplan-attribution/assets/bridge.js' in raw},ensure_ascii=False))
              except Exception as e: print(json.dumps({'bridge_probe_url':url.split('?')[0],'error':str(e)[:160]},ensure_ascii=False))
          PY
