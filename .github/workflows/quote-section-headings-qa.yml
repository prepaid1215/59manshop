name: Quotation section headings QA
on:
  push:
    branches: [design/quote-section-headings-20261026]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SEO and internal link checks
        run: python scripts/check_site.py
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify quote headings and prevent overflow
        run: |
          python scripts/serve_preview.py >/tmp/preview.log 2>&1 &
          sleep 2
          node scripts/assert_quote_headings.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quote-heading-preview
          path: reports/ui/quote-heading-qa/
          if-no-files-found: warn
