name: Unified article design QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check design consistency across all indexed detail pages
        run: |
          python scripts/serve_preview.py >/tmp/site-preview.log 2>&1 &
          sleep 2
          node scripts/assert_unified_article_design.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 59man-unified-article-screenshots
          path: reports/ui/design-unification/
          if-no-files-found: warn
