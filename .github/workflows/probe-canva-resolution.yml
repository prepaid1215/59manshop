name: Probe Canva image asset resolution
on:
  push:
    paths:
      - .github/workflows/probe-canva-resolution.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare signed CDN URLs
        env:
          THUMB_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F682f46fe-0bcc-4ebb-b44d-1385c0d869ab/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAALpAuKmDNrt6M0tmeBHFKP0mUnG4oWLNkNLPiDJPe1DO&exp=1793019274&osig=AAAAAAAAAAAAAAAAAAAAABYT05_dCOJM8MeObTrYFluE-krGikJ4vEH9zbr_kGCw&signer=media-rpc&token=AAIAAU0AJDY4MmY0NmZlLTBiY2MtNGViYi1iNDRkLTEzODVjMGQ4NjlhYgAAAAABoXhG4xBwoBajHjosauo79M6sPOtL57woUqbkhsZ6ztsdgCPfXg&x-canva-quality=thumbnail"
          FULL_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:1024/quality:85/uri:ifs%3A%2F%2FM%2F682f46fe-0bcc-4ebb-b44d-1385c0d869ab/watermark:F/width:1024?csig=AAAAAAAAAAAAAAAAAAAAALpAuKmDNrt6M0tmeBHFKP0mUnG4oWLNkNLPiDJPe1DO&exp=1793019274&osig=AAAAAAAAAAAAAAAAAAAAABYT05_dCOJM8MeObTrYFluE-krGikJ4vEH9zbr_kGCw&signer=media-rpc&token=AAIAAU0AJDY4MmY0NmZlLTBiY2MtNGViYi1iNDRkLTEzODVjMGQ4NjlhYgAAAAABoXhG4xBwoBajHjosauo79M6sPOtL57woUqbkhsZ6ztsdgCPfXg&x-canva-quality=thumbnail"
          DIRECT_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:1024/quality:85/uri:ifs%3A%2F%2FM%2F682f46fe-0bcc-4ebb-b44d-1385c0d869ab/watermark:F/width:1024"
        run: |
          for type in THUMB FULL DIRECT; do
            key="${type}_URL"
            status=$(curl -L -s -S -w "%{http_code}" --max-time 20 -o /tmp/"$type".jpg "${!key}" || true)
            bytes=$(wc -c </tmp/"$type".jpg 2>/dev/null || echo 0)
            echo "$type HTTP=$status BYTES=$bytes"
            file /tmp/"$type".jpg || true
          done
