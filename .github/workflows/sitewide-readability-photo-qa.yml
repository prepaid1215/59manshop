name: All article readability and photo manager QA
on:
  push:
    branches:
      - design/all-article-readability-photos-20261026
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SEO and link checks
        run: python scripts/check_site.py
      - name: Verify article text, links and metadata unchanged
        run: python scripts/assert_sitewide_content.py
      - name: JavaScript syntax check
        run: |
          node --check assets/site.js
          node --check assets/photo-manager.js
          node --check scripts/assert_photo_manager.cjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Preview manager, photo slots and responsive reading
        run: |
          python scripts/serve_preview.py >/tmp/preview.log 2>&1 &
          sleep 2
          node scripts/assert_photo_manager.cjs
          node scripts/assert_editorial_pilot.cjs
