name: Temporary five-step cover renderer
on:
  push:
    branches: [fix/cover-five-step-20261028]
    paths:
      - 'img/.cover-02-five-step.svg'
      - '.github/workflows/cover-five-step-render.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install SVG and Korean font renderers
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-noto-cjk python3-pil
      - name: Rasterize image as existing JPEG sizes
        run: |
          rsvg-convert -w 1254 -h 1254 img/.cover-02-five-step.svg -o /tmp/cover-02.png
          python3 - <<'PY'
          from PIL import Image
          img = Image.open("/tmp/cover-02.png").convert("RGB")
          img.save("img/cover-02-activation-steps-og.jpg", "JPEG", quality=92, optimize=True)
          img.resize((640,640), Image.Resampling.LANCZOS).save("img/cover-02-activation-steps-mobile.jpg", "JPEG", quality=90, optimize=True)
          PY
      - name: Commit only final JPEGs and remove temporary renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/cover-02-activation-steps-og.jpg img/cover-02-activation-steps-mobile.jpg
          git rm img/.cover-02-five-step.svg .github/workflows/cover-five-step-render.yml
          git commit -m "Replace 6-step cover artwork with matching 5-step JPEGs"
          git push origin HEAD:fix/cover-five-step-20261028
