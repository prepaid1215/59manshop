name: Site SEO and link QA
on:
  push:
    branches:
      - main
      - design/mobile-hub-20261025
      - design/brand-blue-svg-20261025
      - design/information-hub-20261025
      - fix/restore-mobile-only-20261025
      - fix/guide-button-css-20261026
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check sitemap, canonical, internal links and pages
        run: python scripts/check_site.py
      - name: Preserve production SEO and content during redesign
        if: github.head_ref == 'design/information-hub-20261025' || github.ref == 'refs/heads/design/information-hub-20261025' || github.head_ref == 'fix/restore-mobile-only-20261025' || github.ref == 'refs/heads/fix/restore-mobile-only-20261025'
        run: python scripts/check_preservation.py --base 727568f
