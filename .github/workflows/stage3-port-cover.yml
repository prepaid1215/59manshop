name: Temporary stage 3 cover label correction
on:
  push:
    branches: [fix/stage3-port-cover-20261028]
    paths:
      - 'scripts/.stage3-port-cover.py'
      - '.github/workflows/stage3-port-cover.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies and Korean font
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          python -m pip install pillow opencv-python-headless
      - name: Edit 11 cover and audit
        run: |
          python scripts/.stage3-port-cover.py
          python scripts/check_site.py
          python scripts/assert_indexed_article_images.py
      - name: Commit final assets only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/cover-11-number-port-og.jpg img/cover-11-number-port-mobile.jpg
          git rm scripts/.stage3-port-cover.py .github/workflows/stage3-port-cover.yml
          git commit -m "Stage 3: clarify number transfer arrears condition on cover 11"
          git push origin HEAD:fix/stage3-port-cover-20261028
