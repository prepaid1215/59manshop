name: Naver Blog RSS to 59man.shop

on:
  push:
    branches: [main]
  schedule:
    # GitHub schedules are UTC; actual start can be delayed.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: naver-blog-pages
  cancel-in-progress: false

jobs:
  build:
    name: Sync RSS and package static pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate RSS sync script and static markers
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path("scripts/sync_naver_blog.py").read_text(encoding="utf-8"))
          for name, start, end in [
              ("index.html", "<!-- NAVER_BLOG_HOME_START -->", "<!-- NAVER_BLOG_HOME_END -->"),
              ("blog/index.html", "<!-- NAVER_BLOG_LIST_START -->", "<!-- NAVER_BLOG_LIST_END -->"),
          ]:
              text = Path(name).read_text(encoding="utf-8")
              assert text.count(start) == text.count(end) == 1, name
          PY

      - name: Refresh latest posts from Naver RSS
        run: python scripts/sync_naver_blog.py

      - name: Commit updated static article links
        run: |
          if ! git diff --quiet -- index.html blog/index.html sitemap.xml data/naver-blog-posts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html blog/index.html sitemap.xml data/naver-blog-posts.json
            git commit -m "Update Naver RSS post links"
            git push origin HEAD:main
          else
            echo "No new Naver RSS posts."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    name: Publish RSS link updates to 59man.shop
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
