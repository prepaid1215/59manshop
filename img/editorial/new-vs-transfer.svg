<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="선불폰 신규가입과 번호이동 차이"><defs><style>text{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.tag{font-size:23px;fill:#175cd3;font-weight:800}.title{font-size:43px;fill:#1b2c45;font-weight:900}.label{font-size:23px;fill:#526782;font-weight:730}.value{font-size:35px;fill:#174f99;font-weight:900}.note{font-size:21px;fill:#385374;font-weight:710}</style></defs><rect width="900" height="620" rx="28" fill="#edf5ff"/><rect x="23" y="23" width="854" height="574" rx="26" fill="#fff" stroke="#d9e7fb" stroke-width="2"/><text x="60" y="92" class="tag">59만모바일 | 번호 선택</text><text x="60" y="151" class="title">가입 유형을 먼저 정하세요</text><rect x="60" y="195" width="374" height="296" rx="18" fill="#f2f7ff" stroke="#dce9f9" stroke-width="2"/><rect x="453" y="195" width="387" height="296" rx="18" fill="#f2f7ff" stroke="#dce9f9" stroke-width="2"/><text x="90" y="250" class="value" >신규가입</text><text x="90" y="306" class="label" >번호를 추가하거나</text><text x="90" y="346" class="label" >기존 번호 유지 후</text><text x="90" y="387" class="note" >추가 회선을 만드는 방식</text><text x="484" y="250" class="value" >번호이동</text><text x="482" y="306" class="label" >사용 중인 번호를</text><text x="482" y="346" class="label" >통신망만 바꿔</text><text x="482" y="387" class="note" >계속 사용하는 방식</text><rect x="60" y="527" width="780" height="52" rx="13" fill="#e8f2ff"/><text x="450" y="561" class="note" text-anchor="middle">미납·정지 중인 번호는 번호이동할 수 없습니다</text></svg>