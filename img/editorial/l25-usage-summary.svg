<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-label="L망 2.5GB 선불 요금제 월 17000원 통화100분 문자50건"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#175cd3"/><stop offset="1" stop-color="#103a8d"/></linearGradient><style>text{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif} .eyebrow{font-size:25px;font-weight:800;letter-spacing:1.5px;fill:#175cd3}.heading{font-size:45px;font-weight:900;fill:#172b46}.sub{font-size:26px;fill:#4e6380}.value{font-size:68px;font-weight:900;fill:#175cd3}.label{font-size:28px;font-weight:750;fill:#4a5f7d}.cardvalue{font-size:48px;font-weight:900;fill:#123e85}.fine{font-size:27px;font-weight:700;fill:#294c79}</style></defs><rect x="0" y="0" width="840" height="560" rx="27" fill="url(#bg)"/><rect x="24" y="24" width="792" height="512" rx="25" fill="#fff" stroke="#d7e7fa" stroke-width="2"/><text x="58" y="96" class="eyebrow" >L망 / 소량 사용 요금제</text><text x="58" y="158" class="heading" >월 17,000원</text><rect x="57" y="204" width="230" height="215" rx="19" fill="#eaf2ff" stroke="#d9e7fc" stroke-width="2"/><text x="172" y="282" class="cardvalue" text-anchor="middle">2.5GB</text><text x="172" y="342" class="label" text-anchor="middle">데이터</text><rect x="305" y="204" width="230" height="215" rx="19" fill="#f5f9ff" stroke="#d9e7fc" stroke-width="2"/><text x="420" y="282" class="cardvalue" text-anchor="middle">100분</text><text x="420" y="342" class="label" text-anchor="middle">음성통화</text><rect x="553" y="204" width="230" height="215" rx="19" fill="#f5f9ff" stroke="#d9e7fc" stroke-width="2"/><text x="668" y="282" class="cardvalue" text-anchor="middle">50건</text><text x="668" y="342" class="label" text-anchor="middle">문자</text><rect x="57" y="448" width="727" height="74" rx="13" fill="#edf4ff" stroke="#d6e8fb"/><text x="420" y="479" class="fine" text-anchor="middle">통화·문자 무제한 상품이 아닙니다</text><text x="420" y="509" class="sub" text-anchor="middle">본인인증·세컨폰 사용량부터 확인하세요</text></svg>