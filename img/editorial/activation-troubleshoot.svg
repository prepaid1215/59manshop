<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="선불폰 개통 오류 발생 시 점검 순서"><defs><style>text{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.tag{font-size:23px;fill:#175cd3;font-weight:800}.title{font-size:43px;fill:#1b2c45;font-weight:900}.label{font-size:23px;fill:#526782;font-weight:730}.value{font-size:35px;fill:#174f99;font-weight:900}.note{font-size:21px;fill:#385374;font-weight:710}</style></defs><rect width="900" height="620" rx="28" fill="#edf5ff"/><rect x="23" y="23" width="854" height="574" rx="26" fill="#fff" stroke="#d9e7fb" stroke-width="2"/><text x="60" y="92" class="tag">59만모바일 | 문제 해결</text><text x="60" y="151" class="title">안 될 때 먼저 확인할 순서</text><rect x="60" y="187" width="780" height="100" rx="18" fill="#eef5ff" stroke="#dce9f9" stroke-width="2"/><text x="90" y="249" class="" font-size="38" fill="#83aee6" font-weight="900">01</text><text x="166" y="227" class="" font-size="27" font-weight="900" fill="#244a7f">안면인증 · 간편인증</text><text x="166" y="265" class="note" >안내 팝업과 인증 수단 확인</text><rect x="60" y="295" width="780" height="100" rx="18" fill="#f9fbff" stroke="#dce9f9" stroke-width="2"/><text x="90" y="357" class="" font-size="38" fill="#83aee6" font-weight="900">02</text><text x="166" y="335" class="" font-size="27" font-weight="900" fill="#244a7f">유심번호 · 통신망</text><text x="166" y="373" class="note" >K망과 L망 입력 방법 구분</text><rect x="60" y="403" width="780" height="100" rx="18" fill="#eef5ff" stroke="#dce9f9" stroke-width="2"/><text x="90" y="465" class="" font-size="38" fill="#83aee6" font-weight="900">03</text><text x="166" y="443" class="" font-size="27" font-weight="900" fill="#244a7f">개통 후 통신 인식</text><text x="166" y="481" class="note" >유심 장착·재부팅·망 확인</text><rect x="60" y="527" width="780" height="52" rx="13" fill="#e8f2ff"/><text x="450" y="561" class="note" text-anchor="middle">오류 문구를 확인한 뒤 해당 단계로 돌아가세요</text></svg>