<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" role="img" aria-label="LG 모두의 원칩 L망 유심정보 입력방법"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6faff"/><stop offset="1" stop-color="#eaf3ff"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#175cd3"/><stop offset="1" stop-color="#103a8d"/></linearGradient><style>text{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif} .eyebrow{font-size:25px;font-weight:800;letter-spacing:1.5px;fill:#175cd3}.heading{font-size:45px;font-weight:900;fill:#172b46}.sub{font-size:26px;fill:#4e6380}.value{font-size:68px;font-weight:900;fill:#175cd3}.label{font-size:28px;font-weight:750;fill:#4a5f7d}.cardvalue{font-size:48px;font-weight:900;fill:#123e85}.fine{font-size:27px;font-weight:700;fill:#294c79}</style></defs><rect x="0" y="0" width="840" height="560" rx="27" fill="url(#bg)"/><rect x="24" y="24" width="792" height="512" rx="25" fill="#fff" stroke="#d7e7fa" stroke-width="2"/><text x="58" y="99" class="eyebrow" >L망 / 원칩 입력 가이드</text><text x="58" y="158" class="heading" >유심번호는 두 칸에 나눠 입력</text><rect x="56" y="199" width="350" height="244" rx="19" fill="#f3f8ff" stroke="#d9e7fc" stroke-width="2"/><rect x="434" y="199" width="350" height="244" rx="19" fill="#f3f8ff" stroke="#d9e7fc" stroke-width="2"/><text x="81" y="251" class="label" >모델코드</text><text x="81" y="321" class="value" >5자리</text><text x="459" y="251" class="label" >일련번호</text><text x="459" y="321" class="value" >8자리</text><text x="81" y="389" class="sub" >유심 카드에서 확인</text><text x="459" y="389" class="sub" >모델코드와 구분</text><rect x="57" y="482" width="726" height="40" rx="12" fill="#e8f2ff"/><text x="420" y="511" class="fine" text-anchor="middle">KT 바로유심의 19자리 입력 방식과 다릅니다</text></svg>